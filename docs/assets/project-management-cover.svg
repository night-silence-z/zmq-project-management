<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">ZMQ Project Management</title>
  <desc id="desc">让项目持续前进，让共识留得下来。三个自适应模式：日常迭代、基线变化、里程碑收口。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D9DDD6" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect width="1280" height="620" rx="20" fill="#F4F3ED"/>
  <rect x="822" y="0" width="458" height="620" fill="url(#grid)"/>
  <path d="M822 0V620" stroke="#D0D7CF"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <rect x="64" y="56" width="38" height="38" rx="9" fill="#244E47"/>
    <path d="M73 68H91L74 82H92" fill="none" stroke="#D6F2C2" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="118" y="72" font-size="14" font-weight="700" letter-spacing="2" fill="#203D36">ZMQ</text>
    <text x="118" y="93" font-size="13" letter-spacing="1.3" fill="#69766C">PROJECT MANAGEMENT</text>

    <text x="64" y="214" font-size="57" font-weight="700" letter-spacing="-1.5" fill="#172B26">让项目持续前进，</text>
    <text x="64" y="295" font-size="57" font-weight="700" letter-spacing="-1.5" fill="#172B26">让共识留得下来。</text>
    <text x="68" y="355" font-size="20" letter-spacing=".3" fill="#5B6B60">Clarity across iterations. Continuity across sessions.</text>
    <text x="68" y="414" font-size="23" font-weight="500" fill="#31584D">目标探索 · 需求沉淀 · 多成果协同</text>
    <rect x="68" y="450" width="154" height="34" rx="17" fill="#E2E8DD"/>
    <text x="145" y="473" text-anchor="middle" font-size="12" font-weight="600" letter-spacing=".6" fill="#315346">AGENT SKILLS</text>
    <rect x="232" y="450" width="178" height="34" rx="17" fill="none" stroke="#C5D0C3"/>
    <text x="321" y="473" text-anchor="middle" font-size="12" font-weight="600" letter-spacing=".5" fill="#5C6B5E">MODEL-AGNOSTIC</text>

    <rect x="860" y="68" width="356" height="453" rx="20" fill="#193B32"/>
    <text x="888" y="109" font-size="12" font-weight="600" letter-spacing="1.5" fill="#A8C4AD">THREE ADAPTIVE MODES</text>
    <path d="M888 132H1188" stroke="#36594A"/>
    <path d="M903 203V448" stroke="#466B57" stroke-width="1.5" stroke-dasharray="4 6"/>

    <circle cx="903" cy="181" r="15" fill="#D7EEC2"/>
    <text x="903" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#244833">01</text>
    <text x="934" y="184" font-size="24" font-weight="600" fill="#F1F3E8">轻量日常迭代</text>
    <text x="934" y="216" font-size="14" fill="#B4CCB9">持续推进，默认采用</text>
    <rect x="934" y="232" width="76" height="23" rx="11.5" fill="#315544"/>
    <text x="972" y="248" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1" fill="#D7EEC2">DEFAULT</text>

    <circle cx="903" cy="306" r="15" fill="#365B48" stroke="#759782"/>
    <text x="903" y="311" text-anchor="middle" font-size="11" font-weight="600" fill="#D6E6D3">02</text>
    <text x="934" y="310" font-size="24" font-weight="600" fill="#F1F3E8">项目基线变化</text>
    <text x="934" y="343" font-size="14" fill="#B4CCB9">关键取舍，保留依据</text>

    <circle cx="903" cy="415" r="15" fill="#365B48" stroke="#759782"/>
    <text x="903" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#D6E6D3">03</text>
    <text x="934" y="419" font-size="24" font-weight="600" fill="#F1F3E8">里程碑收口</text>
    <text x="934" y="452" font-size="14" fill="#B4CCB9">正式关口，清晰交付</text>

    <path d="M64 548H1216" stroke="#CDD5C9"/>
    <text x="68" y="582" font-size="12" font-weight="600" letter-spacing="1.2" fill="#627464">PRODUCT · RESEARCH · DEVELOPMENT</text>
    <text x="1214" y="582" text-anchor="end" font-size="12" letter-spacing="1.2" fill="#627464">ADAPTIVE BY DESIGN</text>
  </g>
</svg>
